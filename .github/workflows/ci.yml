name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Repository auschecken
        uses: actions/checkout@v4

      - name: 🟢 Node.js 20 einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Abhängigkeiten installieren
        run: npm ci

      - name: 🗄️ Prisma Client generieren
        run: npx prisma generate

      - name: ⚙️ TypeScript Check & Production Build
        run: npm run build
